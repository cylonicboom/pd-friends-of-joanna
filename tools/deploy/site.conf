# site.conf: where tools/deploy/deploy puts the dedicated server.
# Sourced as shell. Each line only sets a value nobody set yet, so a
# DEPLOY_* env var, or the same line in site.local.conf (untracked, read
# first), wins over what is here.

# ssh destination. User, key and port belong in ~/.ssh/config under this
# host; DEPLOY_USER only if you'd rather not.
: "${DEPLOY_HOST:=baeddel.institute}"
: "${DEPLOY_USER:=}"
: "${DEPLOY_SSH_OPTS:=}"

# remote dir; relative means under the remote $HOME
: "${DEPLOY_DIR:=fojo-net}"

# the game's UDP port (NET_DEFAULT_PORT) and the Xvfb display number
: "${DEPLOY_PORT:=27100}"
: "${DEPLOY_DISPLAY:=77}"

# what the host runs, after --host --port. A team mission waits in the hub
# until --team-wait remotes are in, then starts.
: "${DEPLOY_SERVER_ARGS:=--team 0 --team-roles c,b,c,c,c}"

# where `deploy logs` copies the server's logs to; relative to the repo root
# unless absolute. Empty means _inbox/server-logs/<host>/.
: "${DEPLOY_LOGS_DIR:=}"
