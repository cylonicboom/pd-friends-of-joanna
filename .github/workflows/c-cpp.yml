name: C/C++ CI

on:
  push:
    branches: [ "port", "port-friends-of-joanna" ]
  pull_request:
    branches: [ "port" ]
  workflow_dispatch:

jobs:
  build-i686-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            make
            mingw-w64-i686-toolchain
            mingw-w64-i686-SDL2
            mingw-w64-i686-zlib
            mingw-w64-i686-cmake
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build pd.i686.exe
        run: cmake -G"Unix Makefiles" -Bbuild . && cmake --build build -j
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin
          cp build/pd.i686.exe bin/
          cp /mingw32/bin/{SDL2.dll,zlib1.dll,libgcc_s_dw2-1.dll,libwinpthread-1.dll} bin/
          # the mod itself: basedir/data is the shipped data dir, and a checkout
          # holds only its tracked files, so this is the sanitized set by construction
          cp -R basedir/data bin/data
          cp basedir/readme.md basedir/CHANGELOG bin/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foj-i686-windows
          path: bin/
          retention-days: 0

  build-i686-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install git gcc g++ gcc-multilib g++-multilib make libsdl2-dev zlib1g-dev libsdl2-dev:i386 zlib1g-dev:i386 cmake
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build pd.i686
        run: cmake -G"Unix Makefiles" -Bbuild -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 . && cmake --build build -j
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin
          cp build/pd.i686 bin/
          # the mod itself: basedir/data is the shipped data dir, and a checkout
          # holds only its tracked files, so this is the sanitized set by construction
          cp -R basedir/data bin/data
          cp basedir/readme.md basedir/CHANGELOG bin/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foj-i686-linux
          path: bin/
          retention-days: 0

  build-x86_64-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-cmake
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build pd.x86_64.exe
        run: cmake -G"Unix Makefiles" -Bbuild . && cmake --build build -j
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin
          cp build/pd.x86_64.exe bin/
          cp /mingw64/bin/{SDL2.dll,zlib1.dll,libwinpthread-1.dll,libgcc_s_seh-1.dll} bin/
          # the mod itself: basedir/data is the shipped data dir, and a checkout
          # holds only its tracked files, so this is the sanitized set by construction
          cp -R basedir/data bin/data
          cp basedir/readme.md basedir/CHANGELOG bin/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foj-x86_64-windows
          path: bin/
          retention-days: 0

  # The tools that WRITE what the engine reads. Every other job here builds the
  # engine, so until this one a filetable builder could stop agreeing with the
  # reader and nothing would say so until a mod failed to load in someone's
  # game - which is how the v4 bump was found, by a shipped binary refusing a
  # table it had never heard of.
  #
  # It cannot check the mods that actually ship: those live in
  # pd-fojo-basedir, a separate private repository, and this one has no mod
  # data in it. So it checks what is hermetic - that the tools build, that the
  # name rules still reject what they claim to, and that a table written here
  # can be read back here - and the real roster is checked where the data is.
  build-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc make zlib1g-dev python3
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build mkfiletable and slugmod
        run: make -C tools/mkfiletable all
      - name: Build modsetcheck
        run: make -C tools/modsetcheck
      - name: Check the filetable name rules
        run: make -C tools/mkfiletable pdftrules_test && tools/mkfiletable/pdftrules_test
      - name: Build a mod and read it back
        run: sh tools/modsetcheck/selftest.sh

  build-x86_64-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture amd64
          sudo apt-get update
          sudo apt-get install git gcc g++ gcc-multilib g++-multilib make libsdl2-dev zlib1g-dev libsdl2-2.0-0 cmake
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build pd.x86_64
        run: cmake -G"Unix Makefiles" -Bbuild . && cmake --build build -j
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin
          cp build/pd.x86_64 bin/
          # the mod itself: basedir/data is the shipped data dir, and a checkout
          # holds only its tracked files, so this is the sanitized set by construction
          cp -R basedir/data bin/data
          cp basedir/readme.md basedir/CHANGELOG bin/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foj-x86_64-linux
          path: bin/
          retention-days: 0

  build-x86_64-osx:
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: |
          brew install zlib
          wget http://libsdl.org/release/SDL2-2.30.9.dmg -O SDL2.dmg
          hdiutil mount SDL2.dmg
          sudo cp -vr /Volumes/SDL2/SDL2.framework /Library/Frameworks
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build pd.x86_64
        run: |
          cmake -G"Unix Makefiles" -Bbuild -DCMAKE_OSX_ARCHITECTURES=x86_64 .
          cmake --build build --target pd -j4 --clean-first
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin
          cp build/pd.x86_64 bin/
          cp -vr /Library/Frameworks/SDL2.framework bin/
          # the mod itself: basedir/data is the shipped data dir, and a checkout
          # holds only its tracked files, so this is the sanitized set by construction
          cp -R basedir/data bin/data
          cp basedir/readme.md basedir/CHANGELOG bin/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foj-x86_64-osx
          path: bin/
          retention-days: 0

  build-arm64-osx:
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: |
          brew install zlib
          wget http://libsdl.org/release/SDL2-2.30.9.dmg -O SDL2.dmg
          hdiutil mount SDL2.dmg
          sudo cp -vr /Volumes/SDL2/SDL2.framework /Library/Frameworks
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build pd.arm64
        run: |
          cmake -G"Unix Makefiles" -Bbuild -DCMAKE_OSX_ARCHITECTURES=arm64 .
          cmake --build build --target pd -j4 --clean-first
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin
          cp build/pd.arm64 bin/
          cp -vr /Library/Frameworks/SDL2.framework bin/
          # the mod itself: basedir/data is the shipped data dir, and a checkout
          # holds only its tracked files, so this is the sanitized set by construction
          cp -R basedir/data bin/data
          cp basedir/readme.md basedir/CHANGELOG bin/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foj-arm64-osx
          path: bin/
          retention-days: 0

  build-arm64-nswitch:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/port'
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git make cmake curl
      - name: Install devkitA64 docker image
        run: sudo docker pull devkitpro/devkita64:latest
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build pd.arm64.nro
        run: sudo docker run --name pd --rm -v `pwd`:`pwd` -w `pwd` devkitpro/devkita64:latest bash ./tools/buildscripts/nswitch_docker.sh build
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin/perfectdark/data
          cp build/pd.arm64.nro bin/perfectdark/
          for d in perfectdark; do rm -rf bin/$d/data && cp -R basedir/data bin/$d/data; done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foj-arm64-nswitch
          path: bin/
          retention-days: 0

  build-flatpak-bundle:
    name: "Build flatpak bundle"
    runs-on: ubuntu-latest
    needs: [build-x86_64-linux]
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-23.08
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: foj-x86_64-linux
        path: dist/linux/bin/

    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: io.github.fgsfdsfgs.perfect_dark.flatpak
        manifest-path: dist/linux/io.github.fgsfdsfgs.perfect_dark.yaml
        cache-key: flatpak-builder-${{ github.sha }}
        upload-artifact: false

    # - name: Build Flatpak bundle
    #   run: |
    #     cd dist/linux/
    #     flatpak-builder build --force-clean io.github.fgsfdsfgs.perfect_dark.yaml
    #     flatpak build-export export build
    #     flatpak build-bundle export io.github.fgsfdsfgs.perfect_dark.flatpak io.github.fgsfdsfgs.perfect_dark

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: io.github.fgsfdsfgs.perfect_dark.flatpak
        path: io.github.fgsfdsfgs.perfect_dark.flatpak
        retention-days: 0


  publish-latest-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/port'
    needs: [build-i686-windows, build-i686-linux, build-x86_64-windows, build-x86_64-linux, build-arm64-nswitch, build-x86_64-osx, build-arm64-osx, build-flatpak-bundle]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
      # The version is the tag in tools/release.config.json, nothing else:
      # bump it there and every bundle from then on carries it. The bundles are
      # the same files a promoted release gets (tools/ci/bundle.sh), under the
      # rolling ci-dev-build tag. To make a real release out of a run, see
      # promote.yml - nothing has to be packaged offline.
      - name: Publish latest dev-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(jq -r .tag tools/release.config.json)
          sh tools/ci/bundle.sh "$tag" ci-artifacts ci-release
          git tag --force ci-dev-build ${{ github.sha }}
          git push --force origin ci-dev-build
          gh release upload --clobber ci-dev-build ci-release/*
